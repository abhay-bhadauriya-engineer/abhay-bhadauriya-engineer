<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Abhay Pratap Singh Profile Header">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#150a2e"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="500" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animate attributeName="x1" values="200;700;200" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="500;1000;500" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blur">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <clipPath id="round">
      <rect width="1000" height="320" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="320" fill="url(#bg)"/>

    <!-- Ambient glowing spheres -->
    <g filter="url(#blur)">
      <circle cx="160" cy="80" r="130" fill="#2563eb" opacity="0.35">
        <animate attributeName="cx" values="160;360;160" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="80;220;80" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="840" cy="240" r="140" fill="#7c3aed" opacity="0.35">
        <animate attributeName="cx" values="840;640;840" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="240;80;240" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="500" cy="160" r="110" fill="#db2777" opacity="0.25">
        <animate attributeName="r" values="100;150;100" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Star dots -->
    <g fill="#ffffff" opacity="0.6">
      <circle cx="120" cy="60" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="280" cy="240" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="40" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="70" r="1.2"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="180" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="260" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Scanning line -->
    <rect x="0" y="-4" width="1000" height="3" fill="url(#scan)">
      <animate attributeName="y" from="-4" to="320" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- Main Content -->
    <text x="500" y="70" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#a78bfa">HELLO WORLD, I'M</text>

    <text x="500" y="145" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="6" fill="url(#name)" filter="url(#glow)">ABHAY PRATAP SINGH</text>

    <!-- Rotating animated subtitles -->
    <text x="500" y="205" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#e2e8f0" opacity="0">
      B.TECH IT STUDENT • UIET KANPUR
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.28;0.36;1" dur="10s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="205" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#60a5fa" opacity="0">
      PYTHON &amp; DATA STRUCTURES ENTHUSIAST
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.28;0.36;1" dur="10s" begin="2.5s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="205" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#a78bfa" opacity="0">
      AI/ML INTERN @ THE ALPHA ENTERPRISES
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.28;0.36;1" dur="10s" begin="5.0s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="205" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="4" fill="#f472b6" opacity="0">
      OPEN TO SOFTWARE ENGINEER OPPORTUNITIES
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.28;0.36;1" dur="10s" begin="7.5s" repeatCount="indefinite"/>
    </text>

    <text x="500" y="255" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" letter-spacing="3" fill="#94a3b8">UIET KANPUR (CSJMU)  //  CLASS OF 2027</text>
  </g>

  <!-- Glowing borders -->
  <rect x="2" y="2" width="996" height="316" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <rect x="2" y="2" width="996" height="316" rx="21" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="260 2360" pathLength="2620">
    <animate attributeName="stroke-dashoffset" from="0" to="-2620" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
