<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Journey timeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#17143a"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.33" stop-color="#34d399"/>
      <stop offset="0.66" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="230" rx="22"/></clipPath>
    <filter id="soft"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/></filter>
  </defs>

  <g clip-path="url(#round)" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <text x="50" y="44" font-size="22" font-weight="700" fill="#e2e8f0">&#128640; Experience &amp; Academic Milestones</text>
    <line x1="50" y1="56" x2="950" y2="56" stroke="#ffffff" stroke-opacity="0.1"/>

    <!-- Connecting Timeline Track -->
    <line x1="120" y1="110" x2="880" y2="110" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="110" x2="880" y2="110" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Milestone 1: College -->
    <g transform="translate(130, 0)">
      <circle cx="0" cy="110" r="11" fill="#0b1020" stroke="#60a5fa" stroke-width="3.5"/>
      <circle cx="0" cy="110" r="4.5" fill="#60a5fa"/>
      <rect x="-85" y="68" width="170" height="26" rx="13" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-opacity="0.3"/>
      <text x="0" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#60a5fa">2023 – 2027</text>
      <text x="0" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">B.Tech IT</text>
      <text x="0" y="160" text-anchor="middle" font-size="12" fill="#94a3b8">UIET Kanpur (CSJMU)</text>
      <text x="0" y="177" text-anchor="middle" font-size="11" fill="#64748b">Computer Science Core</text>
    </g>

    <!-- Milestone 2: Enalisis Intern -->
    <g transform="translate(380, 0)">
      <circle cx="0" cy="110" r="11" fill="#0b1020" stroke="#34d399" stroke-width="3.5"/>
      <circle cx="0" cy="110" r="4.5" fill="#34d399"/>
      <rect x="-95" y="68" width="190" height="26" rx="13" fill="#34d399" fill-opacity="0.12" stroke="#34d399" stroke-opacity="0.3"/>
      <text x="0" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#34d399">May 2026 – Jul 2026</text>
      <text x="0" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">Summer Intern</text>
      <text x="0" y="160" text-anchor="middle" font-size="12" fill="#94a3b8">Enalisis</text>
      <text x="0" y="177" text-anchor="middle" font-size="11" fill="#64748b">Digital Infra &amp; System Design</text>
    </g>

    <!-- Milestone 3: AI/ML Intern -->
    <g transform="translate(630, 0)">
      <circle cx="0" cy="110" r="11" fill="#0b1020" stroke="#a78bfa" stroke-width="3.5"/>
      <circle cx="0" cy="110" r="4.5" fill="#a78bfa"/>
      <rect x="-95" y="68" width="190" height="26" rx="13" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.3"/>
      <text x="0" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#a78bfa">Jul 2026 – Oct 2026</text>
      <text x="0" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">AI / ML Intern</text>
      <text x="0" y="160" text-anchor="middle" font-size="12" fill="#94a3b8">The Alpha Enterprises</text>
      <text x="0" y="177" text-anchor="middle" font-size="11" fill="#64748b">Machine Learning &amp; AI</text>
    </g>

    <!-- Milestone 4: Next Target -->
    <g transform="translate(870, 0)">
      <circle cx="0" cy="110" r="11" fill="#0b1020" stroke="#f472b6" stroke-width="3.5"/>
      <circle cx="0" cy="110" r="4.5" fill="#f472b6"/>
      <rect x="-75" y="68" width="150" height="26" rx="13" fill="#f472b6" fill-opacity="0.12" stroke="#f472b6" stroke-opacity="0.3"/>
      <text x="0" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#f472b6">Next Milestone</text>
      <text x="0" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">Software Engineer</text>
      <text x="0" y="160" text-anchor="middle" font-size="12" fill="#94a3b8">Internship / Full-Time</text>
      <text x="0" y="177" text-anchor="middle" font-size="11" fill="#64748b">Ready to Contribute &amp; Ship</text>
    </g>
  </g>
</svg>
